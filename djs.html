<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倒计时分组</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui;
            padding: 16px;
            max-width: 700px;
            margin: 0 auto;
        }
        .group {
            border: 1px solid #ccc;
            margin:10px 0;
            border-radius:8px;
            overflow:hidden;
        }
        .group-header {
            padding:12px 16px;
            background:#f5f5f5;
            cursor:pointer;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .group-content {
            padding:12px 16px;
            display:none;
        }
        .group-content.open {
            display:block;
        }
        .timer-item {
            margin:8px 0;
            padding:10px;
            border:1px solid #ddd;
            border-radius:6px;
        }
        .timer-end {
            background:#ffdddd !important;
            border-color:#f88 !important;
        }
        .time-text {
            font-size:22px;
            margin:6px 0;
        }
        button {
            padding:6px 10px;
            margin:2px;
        }
        a {
            display:inline-block;
            margin-bottom:16px;
        }
    </style>
</head>
<body>
    <a href="./index.html">返回首页 index.html</a>

    <div class="group" data-seconds="60">
        <div class="group-header">
            <span>1分钟倒计时组</span>
            <span>▼</span>
        </div>
        <div class="group-content">
            <div class="timer-item"></div>
            <div class="timer-item"></div>
            <div class="timer-item"></div>
            <div class="timer-item"></div>
        </div>
    </div>

    <div class="group" data-seconds="120">
        <div class="group-header">
            <span>2分钟倒计时组</span>
            <span>▼</span>
        </div>
        <div class="group-content">
            <div class="timer-item"></div>
            <div class="timer-item"></div>
            <div class="timer-item"></div>
            <div class="timer-item"></div>
        </div>
    </div>

    <div class="group" data-seconds="180">
        <div class="group-header">
            <span>3分钟倒计时组</span>
            <span>▼</span>
        </div>
        <div class="group-content">
            <div class="timer-item"></div>
            <div class="timer-item"></div>
            <div class="timer-item"></div>
            <div class="timer-item"></div>
        </div>
    </div>

    <div class="group" data-seconds="240">
        <div class="group-header">
            <span>4分钟倒计时组</span>
            <span>▼</span>
        </div>
        <div class="group-content">
            <div class="timer-item"></div>
            <div class="timer-item"></div>
            <div class="timer-item"></div>
            <div class="timer-item"></div>
        </div>
    </div>

    <div class="group" data-seconds="300">
        <div class="group-header">
            <span>5分钟倒计时组</span>
            <span>▼</span>
        </div>
        <div class="group-content">
            <div class="timer-item"></div>
            <div class="timer-item"></div>
            <div class="timer-item"></div>
            <div class="timer-item"></div>
        </div>
    </div>

<script>
// 每个计时器数据，使用时间戳方案，解决手机后台休眠暂停
class TimerItem {
    constructor(el, totalSec) {
        this.el = el;
        this.totalSec = totalSec;
        this.startTs = null; // 开始时间戳 ms
        this.pauseRemain = null; // 暂停时剩余秒数
        this.isRunning = false;
        this.isEnd = false;
        this.renderHtml();
    }

    renderHtml(){
        this.el.innerHTML = `
            <div class="time-text">00:00</div>
            <div>
                <button class="btn-start">开始</button>
                <button class="btn-pause">暂停</button>
                <button class="btn-reset">重新开始</button>
            </div>
        `;
        this.domTime = this.el.querySelector('.time-text');
        this.el.querySelector('.btn-start').onclick = ()=>this.start();
        this.el.querySelector('.btn-pause').onclick = ()=>this.pause();
        this.el.querySelector('.btn-reset').onclick = ()=>this.reset();
    }

    format(s){
        s = Math.max(0, Math.floor(s));
        let m = Math.floor(s/60);
        let sec = s%60;
        return String(m).padStart(2,'0')+":"+String(sec).padStart(2,'0');
    }

    start(){
        if(this.isEnd) return;
        if(!this.isRunning){
            this.isRunning = true;
            if(this.pauseRemain !== null){
                this.startTs = Date.now() + this.pauseRemain*1000 - this.totalSec*1000;
            }else{
                this.startTs = Date.now();
            }
            this.pauseRemain = null;
        }
    }

    pause(){
        if(!this.isRunning) return;
        this.isRunning = false;
        let remain = this.getRemainSeconds();
        this.pauseRemain = remain;
    }

    reset(){
        this.isRunning = false;
        this.isEnd = false;
        this.startTs = null;
        this.pauseRemain = null;
        this.el.classList.remove('timer-end');
        this.domTime.innerText = this.format(this.totalSec);
    }

    getRemainSeconds(){
        if(!this.isRunning){
            if(this.pauseRemain!==null) return this.pauseRemain;
            return this.totalSec;
        }
        let elapsedMs = Date.now() - this.startTs;
        let remainMs = this.totalSec*1000 - elapsedMs;
        return remainMs / 1000;
    }

    update(){
        let r = this.getRemainSeconds();
        this.domTime.innerText = this.format(r);
        if(r <= 0 && !this.isEnd){
            this.isEnd = true;
            this.isRunning = false;
            this.el.classList.add('timer-end');
        }
    }
}

// 初始化全部计时器
const allTimers = [];
document.querySelectorAll('.group').forEach(group=>{
    const total = Number(group.dataset.seconds);
    const items = group.querySelectorAll('.timer-item');
    items.forEach(it=>{
        allTimers.push(new TimerItem(it, total));
    });
    // 折叠展开
    const header = group.querySelector('.group-header');
    const content = group.querySelector('.group-content');
    header.onclick = ()=>{
        content.classList.toggle('open');
    }
});

// 使用requestAnimationFrame循环渲染，切回页面自动校正时间戳
function loop(){
    allTimers.forEach(t=>t.update());
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
