<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倒计时分组</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 16px;
            max-width: 720px;
            margin: 0 auto;
            background-color: #fafafa;
        }
        .group {
            border: 1px solid #ccc;
            margin:12px 0;
            border-radius:8px;
            overflow:hidden;
            background:#fff;
        }
        .group-header {
            padding:14px 16px;
            background:#f5f5f5;
            cursor:pointer;
            display:flex;
            justify-content:space-between;
            align-items:center;
            user-select: none;
        }
        .group-content {
            padding:12px 16px;
            display:none;
        }
        /* 只有展开的时候才启用两列网格 */
        .group-content.open {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap:12px;
        }
        .timer-item {
            padding:14px;
            border:1px solid #ddd;
            border-radius:8px;
            margin:0;
        }
        .timer-end {
            background:#ffdddd !important;
            border-color:#f88 !important;
        }
        .time-text {
            font-size:26px;
            margin:8px 0;
            font-weight:500;
        }
        button {
            padding:10px 14px;
            margin:3px;
            font-size:15px;
            border-radius:6px;
            border:1px solid #bbb;
            background:#fff;
        }
        a {
            display:inline-block;
            margin-bottom:16px;
        }
    </style>
</head>
<body>
    <a href="./index.html">返回首页</a>

    <div class="group" data-seconds="60">
        <div class="group-header">
            <span>1分钟倒计时组</span>
            <span class="arrow">▼</span>
        </div>
        <div class="group-content">
            <div class="timer-item"></div>
            <div class="timer-item"></div>
            <div class="timer-item"></div>
            <div class="timer-item"></div>
        </div>
    </div>

    <div class="group" data-seconds="90">
        <div class="group-header">
            <span>1分半倒计时组</span>
            <span class="arrow">▼</span>
        </div>
        <div class="group-content">
            <div class="timer-item"></div>
            <div class="timer-item"></div>
            <div class="timer-item"></div>
            <div class="timer-item"></div>
        </div>
    </div>

    <div class="group" data-seconds="120">
        <div class="group-header">
            <span>2分钟倒计时组</span>
            <span class="arrow">▼</span>
        </div>
        <div class="group-content">
            <div class="timer-item"></div>
            <div class="timer-item"></div>
            <div class="timer-item"></div>
            <div class="timer-item"></div>
        </div>
    </div>

    <div class="group" data-seconds="150">
        <div class="group-header">
            <span>2分半倒计时组</span>

        <div class="group-content">

        </div>
    </div>

    <div class="group" data-seconds="180">
        <div class="group-header">
            <span>3分钟倒计时组</span>
            <span class="arrow">▼</span>
        </div>
        <div class="group-content">
            <div class="timer-item"></div>
            <div class="timer-item"></div>
            <div class="timer-item"></div>
            <div class="timer-item"></div>
        </div>
    </div>

    <div class="group" data-seconds="210">
        <div class="group-header">
            <span>3分半倒计时组</span>
            <span class="arrow">▼</span>
        </div>
        <div class="group-content">

    <div class="group" data-seconds="300">
        <div class="group-header">
            <span>5分钟倒计时组</span>
            <span class="arrow">▼</span>
        </div>
        <div class="group-content">
            <div class="timer-item"></div>
            <div class="timer-item"></div>
            <div class="timer-item"></div>
            <div class="timer-item"></div>
        </div>
    </div>

<script>
class TimerItem {
    constructor(el, totalSec, idx) {
        this.el = el;
        this.uid = "timer_" + idx;
        this.totalSec = totalSec;
        this.startTs = null;
        this.pauseRemain = null;
        this.isRunning = false;
        this.isEnd = false;
        this.renderHtml();
        this.loadState();
    }

    renderHtml(){
        this.el.innerHTML = `
            <div class="time-text">00:00</div>
            <div>
                <button class="btn-start">开始</button>
                <button class="btn-pause">暂停</button>
                <button class="btn-reset">重新开始</button>
            </div>
        `;
        this.domTime = this.el.querySelector('.time-text');
        this.el.querySelector('.btn-start').onclick = ()=>this.start();
        this.el.querySelector('.btn-pause').onclick = ()=>this.pause();
        this.el.querySelector('.btn-reset').onclick = ()=>this.reset();
    }

    format(s){
        s = Math.max(0, Math.floor(s));
        let m = Math.floor(s/60);
        let sec = s%60;
        return String(m).padStart(2,'0')+":"+String(sec).padStart(2,'0');
    }

    saveState(){
        const state = {
            totalSec: this.totalSec,
            startTs: this.startTs,
            pauseRemain: this.pauseRemain,
            isRunning: this.isRunning,
            isEnd: this.isEnd
        };
        localStorage.setItem(this.uid, JSON.stringify(state));
    }

    loadState(){
        const str = localStorage.getItem(this.uid);
        if(!str) {
            this.domTime.innerText = this.format(this.totalSec);
            return;
        }
        try{
            const s = JSON.parse(str);
            this.totalSec = s.totalSec;
            this.startTs = s.startTs;
            this.pauseRemain = s.pauseRemain;
            this.isRunning = s.isRunning;
            this.isEnd = s.isEnd;
            if(this.isEnd){
                this.el.classList.add('timer-end');
            }
        }catch(e){
            this.domTime.innerText = this.format(this.totalSec);
        }
    }

    start(){
        if(this.isEnd) return;
        if(!this.isRunning){
            this.isRunning = true;
            if(this.pauseRemain !== null){
                this.startTs = Date.now() + this.pauseRemain*1000 - this.totalSec*1000;
            }else{
                this.startTs = Date.now();
            }
            this.pauseRemain = null;
        }
        this.saveState();
    }

    pause(){
        if(!this.isRunning) return;
        this.isRunning = false;
        let remain = this.getRemainSeconds();
        this.pauseRemain = remain;
        this.saveState();
    }

    reset(){
        this.isRunning = false;
        this.isEnd = false;
        this.startTs = null;
        this.pauseRemain = null;
        this.el.classList.remove('timer-end');
        this.domTime.innerText = this.format(this.totalSec);
        this.saveState();
    }

    getRemainSeconds(){
        if(!this.isRunning){
            if(this.pauseRemain!==null) return this.pauseRemain;
            return this.totalSec;
        }
        let elapsedMs = Date.now() - this.startTs;
        let remainMs = this.totalSec*1000 - elapsedMs;
        return remainMs / 1000;
    }

    update(){
        let r = this.getRemainSeconds();
        this.domTime.innerText = this.format(r);
        if(r <= 0 && !this.isEnd){
            this.isEnd = true;
            this.isRunning = false;
            this.el.classList.add('timer-end');
            this.saveState();
        }
    }
}

const allTimers = [];
let timerIndex = 0;
document.querySelectorAll('.group').forEach(group=>{
    const total = Number(group.dataset.seconds);
    const items = group.querySelectorAll('.timer-item');
    items.forEach(it=>{
        allTimers.push(new TimerItem(it, total, timerIndex++));
    });
    const header = group.querySelector('.group-header');
    const content = group.querySelector('.group-content');
    const arrow = group.querySelector('.arrow');
    header.onclick = ()=>{
        content.classList.toggle('open');
        arrow.textContent = content.classList.contains('open') ? '▲' : '▼';
    };
});

function loop(){
    allTimers.forEach(t=>t.update());
    requestAnimationFrame(loop);
}
loop();

document.addEventListener('visibilitychange',()=>{
    if(!document.hidden){
        allTimers.forEach(t=>t.update());
    }
});
</script>
</body>
</html>
